/**:
  ros__parameters:

    version: 1.1.1

    adaptive: true

    pointcloud/deskew: true
    pointcloud/voxelize: true

    imu/calibration: false
    imu/intrinsics/accel/bias: [ 0.0, 0.0, 0.0 ]
    imu/intrinsics/accel/sm:   [ 1.,  0.,  0.,
                                 0.,  1.,  0.,
                                 0.,  0.,  1. ]
    imu/intrinsics/gyro/bias: [ 0.0, 0.0, 0.0 ]

    # IMU extrinsics (from imu_link to base_link)
    extrinsics/imu2baselink/t: [ 0.0, 0.0, 0.0 ] 
    extrinsics/imu2baselink/R: [ 1.,  0.,  0.,
                                 0.,  1.,  0.,
                                 0.,  0.,  1. ]

    # LiDAR extrinsics (from laser_link to base_link)
    extrinsics/lidar2baselink/t: [ 0.040, 0.0, 0.026 ]
    extrinsics/lidar2baselink/R: [ 1.,  0.,  0.,
                                   0.,  1.,  0.,
                                   0.,  0.,  1. ]
